name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm run build:css
      - run: npm run build:site
        env:
          # PostHog project key (public by design). Unset = analytics stays off.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Notify IndexNow (Bing, Yandex, Seznam, Naver, ...) of every URL in the
  # live sitemap after a successful production deploy. Best-effort: a failure
  # here never fails the deploy.
  indexnow:
    runs-on: ubuntu-24.04
    needs: deploy
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_HOST: mockforge.dev
          INDEXNOW_KEY: b7e4c2a9f1d84630a5c7e2b9d0f3a614
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 10 "https://${INDEXNOW_HOST}/sitemap.xml" -o sitemap.xml
          grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##' > urls.txt
          echo "Found $(wc -l < urls.txt) URLs in sitemap"
          test -s urls.txt
          jq -n \
            --arg host "$INDEXNOW_HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://${INDEXNOW_HOST}/${INDEXNOW_KEY}.txt" \
            --rawfile urls urls.txt \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: ($urls | split("\n") | map(select(length > 0)))}' \
            > payload.json
          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @payload.json)
          echo "IndexNow responded HTTP ${status}"
          cat response.txt || true
          case "$status" in 200|202) ;; *) exit 1 ;; esac
